services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mapphayao_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
      - ./database/e2e:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapphayao_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  e2e_pgdata:
